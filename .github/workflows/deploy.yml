name: Deploy Room Tracker to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site (Firebase settings come from repository secrets)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          SHARED_EMAIL: ${{ secrets.SHARED_EMAIL }}
        run: |
          for v in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID SHARED_EMAIL; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository secret $v is not set (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done
          mkdir dist
          cp index.html dist/index.html
          jq -n \
            --arg apiKey "$FIREBASE_API_KEY" \
            --arg authDomain "$FIREBASE_AUTH_DOMAIN" \
            --arg projectId "$FIREBASE_PROJECT_ID" \
            --arg appId "$FIREBASE_APP_ID" \
            --arg sharedEmail "$SHARED_EMAIL" \
            '{apiKey:$apiKey, authDomain:$authDomain, projectId:$projectId, appId:$appId, sharedEmail:$sharedEmail}' \
            > dist/firebase-config.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
